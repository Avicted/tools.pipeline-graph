# Same pinned image, hooks and target as `make pre-commit-pr-run` locally, so
# a green run on the machine means a green run here. Checks what the PR (or the
# push to master) changes: the files it touches and the commits it adds.
name: lint

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # FROM_REF has to exist locally, so fetch every commit, not just the tip.
          fetch-depth: 0

      - name: pre-commit on the PR's changes (in Docker)
        run: make pre-commit-pr-run FROM_REF="$FROM_REF" TO_REF="$TO_REF"
        env:
          # PR: from the base branch tip. Push to master: from the previous tip.
          FROM_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          TO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
