version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    staticcheck:
      checks:
        - all
        - -ST1000 # package comments: not every internal package needs one
        - -ST1003 # naming: Kotlin-derived names (e.g. kts.TIdent) are intentional
        - -QF1001 # De Morgan: !(a || b) reads better for the character-class checks
    gocritic:
      disabled-checks:
        - ifElseChain   # long if/else chains read better than switch in the parsers
        - singleCaseSwitch
  exclusions:
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
