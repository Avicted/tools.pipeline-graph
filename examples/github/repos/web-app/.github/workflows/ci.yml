name: Web CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - name: Build the bundle
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/

  image:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist/
      - name: Build and push the image
        run: make image TAG=${{ github.sha }}
