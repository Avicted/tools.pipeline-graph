<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Pipeline map</title>
<script>
  // Theme before first paint: saved choice, else the OS preference.
  (function () {
    var t = null;
    try { t = localStorage.getItem("pg-theme"); } catch (e) {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ---- themes ------------------------------------------------------------
     Calm map: builds and dependency arrows are neutral; hue means something (rarer node
     kinds, triggers, image flow, lineage direction, search hits). Every hue set was checked
     with the dataviz validator (OKLab CVD and normal-vision distance, contrast) per theme. */
  :root, [data-theme="light"] {
    --bg: #f9f9f7; --panel: #fcfcfb; --ink: #0b0b0b; --muted: #52514e; --faint: #6b6a65; --mark: #898781;
    --line: #e1e0d9; --lane-stroke: #c3c2b7;
    --accent: #256abf; --accent-ink: #fcfcfb;
    --lane-head: #52514e; --lane-title: #fcfcfb; --lane-ext: #eb6834; --lane-ext-title: #0b0b0b;
    --code-bg: #1a1a19; --code-ink: #f0efec; --halo: #fcfcfb; --shadow: 0 1px 2px rgba(11,11,11,.08), 0 2px 8px rgba(11,11,11,.06);
    --hit: #eda100; --up: #6250d6; --down: #e87ba4; --warn: #ec835a;
    --tip-bg: #0b0b0b; --tip-ink: #fcfcfb; --backdrop: rgba(11,11,11,.35);
    --n-build-stroke: #898781; --n-composite-stroke: #2a78d6; --n-external-stroke: #eb6834; --n-make-stroke: #c3c2b7; --n-image-stroke: #1baf7a;
    --e-snapshot: #52514e; --e-artifact: #52514e; --e-trigger: #eb6834; --e-runs: #898781;
    --e-depends: #898781; --e-calls: #898781; --e-produces: #1baf7a; --e-consumes: #1baf7a;
  }
  [data-theme="dark"] {
    --bg: #0d0d0d; --panel: #1a1a19; --ink: #f0efec; --muted: #c3c2b7; --faint: #898781; --mark: #898781;
    --line: #2c2c2a; --lane-stroke: #383835;
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --lane-head: #52514e; --lane-title: #f0efec; --lane-ext: #d95926; --lane-ext-title: #0b0b0b;
    --code-bg: #0d0d0d; --code-ink: #f0efec; --halo: #1a1a19; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.3);
    --hit: #c98500; --up: #9085e9; --down: #d55181; --warn: #ec835a;
    --tip-bg: #f0efec; --tip-ink: #1a1a19; --backdrop: rgba(0,0,0,.6);
    --n-build-stroke: #898781; --n-composite-stroke: #3987e5; --n-external-stroke: #d95926; --n-make-stroke: #52514e; --n-image-stroke: #199e70;
    --e-snapshot: #c3c2b7; --e-artifact: #c3c2b7; --e-trigger: #d95926; --e-runs: #898781;
    --e-depends: #898781; --e-calls: #898781; --e-produces: #199e70; --e-consumes: #199e70;
  }
  /* derived once from the tokens above, so both themes stay in step */
  :root {
    --panel-2: color-mix(in srgb, var(--ink) 4%, var(--panel)); --hover: color-mix(in srgb, var(--ink) 8%, var(--panel));
    --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--panel));
    --lane-a: color-mix(in srgb, var(--ink) 3%, var(--panel)); --lane-b: var(--panel);
    --edge-label: var(--muted); --mono: var(--muted); --badge-bg: var(--hover); --badge-ink: var(--muted);
    --sel: var(--ink);
    --n-build-fill: var(--panel); --n-build-ink: var(--ink);
    --n-make-fill: color-mix(in srgb, var(--ink) 5%, var(--panel)); --n-make-ink: var(--ink);
    --n-composite-fill: color-mix(in srgb, var(--n-composite-stroke) 9%, var(--panel)); --n-composite-ink: var(--ink);
    --n-external-fill: color-mix(in srgb, var(--n-external-stroke) 9%, var(--panel)); --n-external-ink: var(--ink);
    --n-image-fill: color-mix(in srgb, var(--n-image-stroke) 9%, var(--panel)); --n-image-ink: var(--ink);
  }

  /* ---- chrome ------------------------------------------------------------ */
  :root {
    --side: 264px; --top: 56px; --panel-h: 340px;
    --shadow-lg: 0 1px 2px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.25); --ease: cubic-bezier(.2,.8,.2,1);
    --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --monof: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-family: var(--sans);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  kbd {
    font-family: var(--monof); font-size: 10px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 0 4px; color: var(--muted); background: var(--panel-2); line-height: 16px; display: inline-block; min-width: 18px; text-align: center;
  }
  header {
    position: fixed; inset: 0 0 auto 0; height: var(--top); display: flex; align-items: center; gap: 10px;
    padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 20;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; white-space: nowrap; }
  .brand h1 { font-size: 16px; margin: 0; }
  .brand .crumb { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .brand .crumb::before { content: "/"; margin-right: 8px; color: var(--faint); }
  .meta-btn {
    border: 0; background: none; color: var(--muted); font-size: 11px; cursor: pointer; padding: 4px 6px; border-radius: 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .meta-btn:hover { background: var(--hover); color: var(--ink); }
  .spacer { flex: 1; }
  .icon-btn, .tools button {
    border: 1px solid var(--line); background: var(--panel); border-radius: 7px; height: 32px; min-width: 32px;
    padding: 0 10px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  }
  .icon-btn:hover, .tools button:hover { background: var(--hover); }
  .tools { display: flex; gap: 6px; align-items: center; }
  .zoom { display: flex; }
  .zoom button { border-radius: 0; margin-left: -1px; }
  .zoom button:first-child { border-radius: 7px 0 0 7px; margin-left: 0; }
  .zoom button:last-child { border-radius: 0 7px 7px 0; }
  #zpct { min-width: 56px; font-variant-numeric: tabular-nums; font-size: 12px; }
  #present-exit { display: none; }

  /* ---- command palette ---------------------------------------------------- */
  .palette-btn {
    display: flex; align-items: center; gap: 8px; height: 32px; width: 300px; padding: 0 8px 0 10px; cursor: pointer; flex: none;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--faint); border-radius: 8px; font-size: 12px; text-align: left;
  }
  .palette-btn:hover { background: var(--hover); color: var(--muted); }
  .palette-btn.active { color: var(--ink); border-color: var(--accent); }
  .palette-btn span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal.pal { align-items: flex-start; padding-top: 12vh; }
  .palette { width: min(640px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop-in .16s var(--ease); }
  .pal-input { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); color: var(--faint); }
  .pal-input input { flex: 1; border: 0; outline: 0; background: none; color: var(--ink); font: inherit; font-size: 16px; height: 52px; min-width: 0; }
  .pal-input input::-webkit-search-cancel-button { display: none; }
  .pal-input input::placeholder { color: var(--faint); }
  #search-count { font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #results { max-height: min(56vh, 520px); overflow-y: auto; padding: 6px; }
  #results h5 { margin: 8px 10px 4px; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
  #results .r { display: flex; gap: 10px; align-items: center; padding: 7px 9px; border-radius: 7px; cursor: pointer; font-size: 12px; }
  #results .r.on, #results .r:hover { background: var(--hover); }
  #results .r.on { box-shadow: inset 3px 0 0 var(--accent); }
  #results .r .main { flex: 1; min-width: 0; }
  #results .r .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results .r .where { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results .r mark { background: var(--hit); color: #0b0b0b; border-radius: 2px; }
  #results .r .ico, #ctx .ico { width: 14px; text-align: center; color: var(--faint); flex: none; }
  #results .r.act .title { font-weight: 500; font-size: 13px; }
  #results .empty, #results .more { color: var(--muted); font-size: 12px; padding: 8px 10px; }
  #results .foot { border-top: 1px solid var(--line); margin-top: 4px; padding: 6px 8px 2px; font-size: 11px; color: var(--faint); display: flex; gap: 12px; }

  /* ---- popovers, toast, tooltip, help ------------------------------------ */
  .pop {
    position: fixed; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-lg); padding: 12px 14px; font-size: 12px; animation: pop-in .14s var(--ease);
  }
  #meta-pop { top: calc(var(--top) - 6px); left: 200px; max-width: min(640px, 90vw); }
  #meta-pop table { border-collapse: collapse; }
  #meta-pop td { padding: 3px 10px 3px 0; white-space: nowrap; }
  #meta-pop td.url { color: var(--muted); font-family: var(--monof); font-size: 11px; white-space: normal; word-break: break-all; }
  #meta-pop a, #panel a, .help a { color: var(--accent); text-decoration: none; cursor: pointer; }
  #meta-pop a:hover, #panel a:hover { text-decoration: underline; }
  #meta-pop .gen { color: var(--muted); margin-bottom: 8px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; transition: .18s ease; z-index: 60;
    background: var(--tip-bg); color: var(--tip-ink); padding: 8px 14px; border-radius: 8px; font-size: 13px; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #tip {
    position: fixed; z-index: 50; pointer-events: none; background: var(--tip-bg); color: var(--tip-ink); font-size: 12px;
    padding: 6px 9px; border-radius: 6px; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,.25);
  }
  #tip small { opacity: .75; display: block; }
  .modal { position: fixed; inset: 0; background: var(--backdrop); z-index: 70; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(3px); }
  .help { background: var(--panel); border-radius: 12px; padding: 20px 24px; width: min(680px, 92vw); max-height: 86vh; overflow: auto; box-shadow: var(--shadow-lg); animation: pop-in .16s var(--ease); }
  .help h2 { margin: 0 0 4px; font-size: 18px; }
  .help p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .help .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 28px; }
  .help h3 { grid-column: 1 / -1; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 12px 0 2px; }
  .help .row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .help .row span:last-child { white-space: nowrap; }

  /* ---- table (landing page) ---------------------------------------------- */
  #table { position: fixed; top: var(--top); right: 0; bottom: 0; left: var(--side); overflow: auto; padding: 16px 24px 40px; transition: left .18s ease; }
  body.collapsed #table { left: 0; }
  body:not(.tbl) #table, body.tbl #canvas, body.tbl #hint, body.tbl .zoom, body.tbl #fit, body.tbl #export, body.tbl #present { display: none; }
  .t-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .t-bar input { flex: 1; min-width: 220px; max-width: 420px; height: 32px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 7px; padding: 0 10px; font: inherit; font-size: 13px; }
  .t-bar .chip { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  .t-bar .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .t-bar .n { color: var(--muted); font-size: 12px; margin-left: auto; }
  #table table { border-collapse: collapse; width: 100%; font-size: 13px; }
  #table th { position: sticky; top: -16px; background: var(--bg); text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
  #table th button { all: unset; cursor: pointer; }
  #table th button:hover, #table th button:focus-visible { color: var(--ink); }
  #table th[aria-sort="ascending"] button::after { content: " ▲"; } #table th[aria-sort="descending"] button::after { content: " ▼"; }
  #table td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  #table tbody tr { cursor: pointer; }
  #table tbody tr:hover, #table tbody tr:focus-visible { background: var(--hover); }
  #table td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #table td small { display: block; color: var(--faint); font-size: 11px; }
  #table .tg { display: inline-block; font-size: 11px; color: var(--badge-ink); background: var(--badge-bg); border-radius: 4px; padding: 0 5px; margin: 0 4px 2px 0; white-space: nowrap; }
  #table .bar { display: inline-block; height: 6px; border-radius: 3px; background: var(--down); margin-right: 6px; vertical-align: middle; }
  #table .empty { color: var(--muted); padding: 24px 10px; }

  /* ---- sidebar ----------------------------------------------------------- */
  #sidebar {
    position: fixed; top: var(--top); left: 0; bottom: 0; width: var(--side); background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; z-index: 15; padding: 12px 10px 20px;
    transition: transform .18s ease;
  }
  body.collapsed #sidebar { transform: translateX(-100%); }
  #sidebar h4 {
    margin: 16px 8px 6px; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); font-weight: 700;
  }
  body.tbl .map-only { display: none; }
  #sidebar h4:first-child { margin-top: 4px; }
  .nav button {
    display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; text-align: left;
    padding: 7px 10px; border-radius: 7px; font-size: 13px; cursor: pointer;
  }
  .nav button:hover { background: var(--hover); }
  .nav button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .nav button .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav button .count { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .nav button kbd { opacity: 0; transition: opacity .1s; }
  .nav button:hover kbd { opacity: 1; }
  .nav button.on .count { color: inherit; opacity: .8; }
  .nav .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--lane-head); flex: none; }
  .legend div { display: flex; align-items: center; gap: 8px; padding: 4px 10px; font-size: 12px; }
  .legend .sw { width: 26px; height: 14px; border-radius: 4px; border: 1.6px solid var(--stroke); background: var(--fill); flex: none; }
  .legend .sw.external { border-style: dashed; } .legend .sw.make { border-width: 1px; } .legend .sw.image { border-radius: 8px; }
  .edges label {
    display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 7px; cursor: pointer;
    user-select: none; font-size: 12px; white-space: nowrap;
  }
  .edges label:hover { background: var(--hover); }
  .edges label.off { opacity: .4; text-decoration: line-through; }
  .edges input { position: absolute; opacity: 0; pointer-events: none; }
  .edges input.vis { position: static; opacity: 1; pointer-events: auto; margin: 0; accent-color: var(--accent); }
  .edges label:has(input:focus-visible) { outline: 2px solid var(--accent); }
  .edges svg { flex: none; }
  #warn-btn {
    margin: 18px 6px 0; width: calc(100% - 12px); border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 16%, var(--panel)); color: var(--ink);
    border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer; text-align: left;
  }
  .side-help { margin: 18px 6px 0; width: calc(100% - 12px); border: 1px dashed var(--line); background: none; color: var(--muted); border-radius: 8px; padding: 8px 10px; font-size: 12px; cursor: pointer; text-align: left; }
  .side-help:hover { background: var(--hover); }

  /* ---- canvas ------------------------------------------------------------ */
  #canvas { position: fixed; top: var(--top); right: 0; bottom: 0; left: var(--side); overflow: hidden; cursor: grab; transition: left .18s ease; touch-action: none; }
  body.collapsed #canvas { left: 0; }
  #canvas.drag { cursor: grabbing; }
  #svg { display: block; width: 100%; height: 100%; }
  #vp { --k: 1; --es: 1; }
  .lane-bg { stroke: var(--lane-stroke); }
  .lane-bg.a { fill: var(--lane-a); } .lane-bg.b { fill: var(--lane-b); }
  .lane-head { fill: var(--lane-head); } .lane-head.ext { fill: var(--lane-ext); }
  .lane-tag { pointer-events: none; }
  .lane-tag rect { fill: var(--lane-head); } .lane-tag.ext rect { fill: var(--lane-ext); } .lane-tag.ext text { fill: var(--lane-ext-title); }
  .lane-tag text { fill: var(--lane-title); font-weight: 700; font-size: 12px; font-family: var(--sans); }
  .edge { fill: none; transition: opacity .15s; stroke-width: calc(var(--w) * var(--es)); }
  .edge.on { stroke-width: calc(var(--w) * var(--es) * 1.9); }
  /* opt-in: continuous SVG animation is costly without GPU compositing */
  body.flow .edge.on { animation: flow 2.4s linear infinite; }
  body.flow .edge.on.solid { stroke-dasharray: 10 6; } /* a solid line needs gaps for the flow to show */
  .edge-hit { fill: none; stroke: transparent; stroke-width: calc(12px * var(--es)); pointer-events: stroke; cursor: pointer; }
  .edge-label { font-size: 10px; font-family: var(--sans); fill: var(--edge-label); paint-order: stroke; stroke: var(--halo); stroke-width: 4px; stroke-linejoin: round; transition: opacity .15s; pointer-events: none; }
  .node { cursor: pointer; transition: opacity .15s; outline: none; }
  .node .card {
    width: 100%; height: 100%; border-radius: 9px; padding: 7px 10px; overflow: hidden; font-size: 11px; line-height: 15px;
    border: 1.6px solid var(--stroke); background: var(--fill); color: var(--ink-n); box-shadow: var(--shadow); font-family: var(--sans);
  }
  .node.build, .sw.build         { --fill: var(--n-build-fill);     --stroke: var(--n-build-stroke);     --ink-n: var(--n-build-ink); }
  .node.composite, .sw.composite { --fill: var(--n-composite-fill); --stroke: var(--n-composite-stroke); --ink-n: var(--n-composite-ink); }
  .node.external, .sw.external   { --fill: var(--n-external-fill);  --stroke: var(--n-external-stroke);  --ink-n: var(--n-external-ink); }
  .node.make, .sw.make           { --fill: var(--n-make-fill);      --stroke: var(--n-make-stroke);      --ink-n: var(--n-make-ink); }
  .node.image, .sw.image         { --fill: var(--n-image-fill);     --stroke: var(--n-image-stroke);     --ink-n: var(--n-image-ink); }
  .node.external .card { border-style: dashed; }
  .node.make .card { border-width: 1px; box-shadow: none; border-radius: 7px; }
  .node.image .card { border-radius: 22px; }
  .node .t { font-weight: 700; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .s { color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .l { font-family: var(--monof); font-size: 10px; color: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .lines { margin-top: 6px; }
  .node .b { margin-top: 5px; display: flex; gap: 4px; flex-wrap: nowrap; overflow: hidden; }
  .node .b span { background: var(--badge-bg); color: var(--badge-ink); border-radius: 4px; padding: 0 5px; font-size: 10px; white-space: nowrap; }
  /* rings are SVG strokes (.ring): a box-shadow would be clipped by the foreignObject and fill the rounded corners */
  .ring { fill: none; pointer-events: none; stroke: var(--ring-c, transparent); stroke-width: calc(2 * var(--ring-w, 0px) * var(--es)); }
  .node:hover, .node:focus-visible { --ring-c: var(--mark); --ring-w: 3px; }
  /* the fill tint keeps direction readable when zoomed out, where a ring thins to a hairline */
  .node.up   { --ring-c: var(--up);   --ring-w: 4px; }
  .node.down { --ring-c: var(--down); --ring-w: 4px; }
  .node.up .card   { background: color-mix(in srgb, var(--up) 16%, var(--fill)); }
  .node.down .card { background: color-mix(in srgb, var(--down) 16%, var(--fill)); }
  .node.end { --ring-w: 6px; }
  .node.hit { --ring-c: var(--hit); --ring-w: 4px; }
  .node.hit.cur { --ring-w: 6px; }
  /* selected: an inverted card reads at any zoom and in compressed screen shares, plus a thick ring */

  });

function applyHidden() {
  vp.querySelectorAll("[data-kind]").forEach(e => e.style.display = hidden.has(e.dataset.kind) ? "none" : "");
}

// ---- highlighting: lineage of the selection, search hits, hover ---------------
function reach(id, dir) {
  const seen = new Set([id]), stack = [id];
  while (stack.length) {
    const cur = stack.pop();
    for (const e of view.edges) {
      if (hidden.has(e.kind)) continue;
      const [a, b] = dir === "down" ? [e.from, e.to] : [e.to, e.from];
      if (a === cur && !seen.has(b)) { seen.add(b); stack.push(b); }
    }
  }
  return seen;
}

// Nodes lying on any route between a and b (either direction); null when unrelated.
function pathBetween(a, b) {
  for (const [from, to] of [[a, b], [b, a]]) {
    const down = reach(from, "down");
    if (down.has(to)) { const up = reach(to, "up"), s = new Set([...down].filter(x => up.has(x))); s.dir = from === a ? "down" : "up"; return s; }
  }
  return null;
}

function paint() {
  const solo = new Set([selected]);
  lineageAll = selected ? { up: reach(selected, "up"), down: reach(selected, "down") } : null;
  path = lineageAll && pathTo ? pathBetween(selected, pathTo) : null;
  lineage = !lineageAll ? null : path ? { up: solo, down: solo } : { up: mode === "down" ? solo : lineageAll.up, down: mode === "up" ? solo : lineageAll.down };
  const hits = new Set(search.inView), cur = search.inView[search.cur];
  vp.querySelectorAll(".node").forEach(g => {
    const id = g.dataset.id;
    const pd = path && id !== selected && path.has(id) ? path.dir : null; // a path takes the colour of its direction
    const up = !!lineage && id !== selected && lineage.up.has(id) || pd === "up", down = !!lineage && id !== selected && lineage.down.has(id) || pd === "down";
    const tint = down && view.kind !== "focus" || pd === "down"; // in a focus view everything downstream is the lineage, so the tint says nothing
    g.classList.toggle("sel", id === selected);
    g.classList.toggle("up", up && !down);
    g.classList.toggle("down", tint);
    g.classList.toggle("end", !!path && id === pathTo);
    g.classList.toggle("hit", hits.has(id));
    g.classList.toggle("cur", id === cur);
    g.classList.toggle("dim", lineage ? !(id === selected || up || down) : !!search.q && !hits.has(id));
  });
  vp.querySelectorAll("[data-from]").forEach(p => {
    const f = p.dataset.from, t = p.dataset.to;
    const on = !!lineage && (path ? path.has(f) && path.has(t) : (lineage.up.has(f) && lineage.up.has(t)) || (lineage.down.has(f) && lineage.down.has(t)));
    p.classList.toggle("on", on);
    p.classList.toggle("dim", lineage ? !on : !!search.q);
  });
  svg.classList.toggle("isolate", !!selected && (!!mode || !!path));
}

function hover(id) {
  if (selected || search.q || drag) id = null;
  svg.classList.toggle("hovering", !!id);
  vp.querySelectorAll(".nb").forEach(e => e.classList.remove("nb"));
  if (!id) return;
  vp.querySelector(`.node[data-id="${CSS.escape(id)}"]`).classList.add("nb");
  vp.querySelectorAll("[data-from]").forEach(p => {
    if (p.dataset.from !== id && p.dataset.to !== id) return;
    p.classList.add("nb");
    const other = p.dataset.from === id ? p.dataset.to : p.dataset.from;
    vp.querySelector(`.node[data-id="${CSS.escape(other)}"]`)?.classList.add("nb");
  });
}

const tip = $("tip");
function showTip(ev, e) {

// ---- navigation state <-> URL ------------------------------------------------
// #<view>, #<view>/<node> or #<view>/<node>/<path end>; every change is a history entry so Back works.
function readHash() {
  const h = location.hash.slice(1), i = h.indexOf("/");
  const vid = decodeURIComponent(i < 0 ? h : h.slice(0, i));
  const [nid, to] = i < 0 ? [] : h.slice(i + 1).split("/").map(decodeURIComponent);
  return { vid, nid: nid || null, to: to || null };
}
function writeHash(push) {
  const h = tableOn ? "#table" + (tbl.q ? "/" + encodeURIComponent(tbl.q) : "") : "#" + encodeURIComponent(view.id) + (selected ? "/" + encodeURIComponent(selected) + (pathTo ? "/" + encodeURIComponent(pathTo) : "") : "");
  if (location.hash !== h) history[push ? "pushState" : "replaceState"](null, "", h);
}

// show is the single entry point for changing what is on screen.
// opts: push (new history entry), focus (centre the node), reveal (pan only if hidden behind the panel), to (path end)
function show(vid, nid, opts = {}) {
  if (vid === "table") return showTable(nid || "", opts);
  const v = viewById[vid] || mapViews[0];
  const wasTable = tableOn;
  if (tableOn) { tableOn = false; document.body.classList.remove("tbl"); }
  if (v !== view) { render(v); } else if (wasTable) fit(false);
  if (nid && !v.ids.has(nid)) nid = null;
  const fresh = nid && nid !== selected;
  if (nid !== selected) mode = null;
  selected = nid;
  pathTo = nid && opts.to && opts.to !== nid && v.ids.has(opts.to) ? opts.to : null;
  paint();
  if (pathTo && !path) {
    toast(`No dependency path between “${DATA.nodes[nid].label}” and “${DATA.nodes[pathTo].label}”`);
    pathTo = null;
    paint();
  }
  hover(null);
  if (nid) { showPanel(nid); dismissHint(); } else { closePanel(); }
  if (path) fitBox(boxOf([...path]), !opts.instant);
  else if (nid && opts.focus) focusNode(nid, Math.max(tf.k, 0.9), !opts.instant);
  else if (nid && opts.reveal) reveal(nid);
  if (fresh) pulse(nid);
  writeHash(opts.push);
}
// in a focus view the root stays selected: it is what the view is about
const clearSelection = () => selected && (view.kind === "focus" ? selected !== view.root && show(view.id, view.root, { push: true }) : show(view.id, null, { push: true }));
const openFocus = id => show("focus:" + id, id, { push: true });
function pulse(id) {

  g.classList.remove("pulse"); void g.getBoundingClientRect(); g.classList.add("pulse");

// jump to a node anywhere: stay in this view when it has the node
function goTo(id, push = true) {

  if (v) show(v.id, id, { push, focus: true });
}

function onLocation() {
  const { vid, nid, to } = readHash();

}

// blast radius / dependencies / full lineage (hide the rest); and the path between two jobs
function setMode(m) {

  }[mode] || "Showing everything");
}

function setPath(b) {

// ---- details panel ----------------------------------------------------------
function link(id) {

function copyBtn(text, label = "Copy") { return `<button class="copy" data-copy="${esc(text)}" title="Copy to clipboard">${label}</button>`; }

// neighbours from this view plus the full graph (views lift or drop some edges)
function neighbours(id, dir) {
  const seen = new Set(), out = [];
  for (const e of [...view.edges, ...(DATA.edges || [])]) {
    if ((dir === "in" ? e.to : e.from) !== id) continue;
    const other = dir === "in" ? e.from : e.to, k = other + "|" + e.kind;
    if (!seen.has(k) && DATA.nodes[other]) { seen.add(k); out.push({ id: other, kind: e.kind, label: e.label }); }
  }
  return out;
}
function relSection(title, list, dirVar) {
  if (!list.length) return "";
  let h = `<h3><span class="sw-dir" style="background:var(${dirVar})"></span>${title} <span class="n">(${list.length})</span></h3>`;
  for (const s of DATA.edgeStyles) {
    const items = list.filter(r => r.kind === s.kind);
    if (!items.length) continue;
    h += `<div class="rk">${swatch(s.kind)}${esc(s.legend)}</div><ul>${items.map(r => `<li>${link(r.id)}${r.label ? ` <small class="dim-ink">${esc(r.label)}</small>` : ""}</li>`).join("")}</ul>`;
  }

function showPanel(id) {

  let head = `<h2>${esc(n.label)}</h2><div class="meta"><span class="pill">${esc(kindName(n))}</span>${esc(n.repo || "")}${n.project ? " · " + esc(n.project) : ""}</div>`;
  head += `<dl class="kv">`;
  if (n.sub) head += `<dt>${n.kind === "build" || n.kind === "external" ? "TeamCity id" : "Where"}</dt><dd><code title="${esc(n.sub)}">${esc(n.sub)}</code>${copyBtn(n.sub)}</dd>`;
  if (n.source) head += `<dt>Source</dt><dd>${src ? `<a href="${esc(src)}" target="_blank" rel="noopener" title="Open at the analysed commit"><code>${esc(n.source)}</code> ↗</a>` : `<code>${esc(n.source)}</code>`}${copyBtn(n.source)}</dd>`;

  const q = pal.cmd ? "" : raw.toLowerCase();
  search.q = q;
  search.terms = q.split(/\s+/).filter(Boolean);
  search.all = [];
  if (q) {
    for (const id in haystack) {
      if (!viewsOf(id).length || !search.terms.every(t => haystack[id].all.includes(t))) continue;
      const h = haystack[id], n = DATA.nodes[id];
      const score = (view.ids.has(id) ? 0 : 100) + (n.label.toLowerCase().startsWith(search.terms[0]) ? 0 : search.terms.every(t => h.title.includes(t)) ? 10 : 50);
      search.all.push({ id, score });
    }
    search.all.sort((a, b) => a.score - b.score || DATA.nodes[a.id].label.localeCompare(DATA.nodes[b.id].label));
  }
  // hits in this view, in reading order (lane by lane, left to right)
  search.inView = search.all.map(r => r.id).filter(id => view.ids.has(id))
    .sort((a, b) => (view.byId[a].y - view.byId[b].y) || (view.byId[a].x - view.byId[b].x));
  search.cur = -1;
  search.active = 0;
  searchLabel();
  paint();
  if (showList) renderResults();
}
// counts live in the palette; the header button echoes the active query so N / Shift+N have feedback
function searchLabel() {
  const q = search.q, n = search.inView.length, pos = search.cur >= 0 ? `${search.cur + 1} / ${n}` : `${n}`;
  $("search-count").textContent = q ? `${pos} here · ${search.all.length} total` : "";
  $("palette-btn").classList.toggle("active", !!q);
  $("pal-label").textContent = q ? `“${q}” · ${pos} here` : "Search or run a command…";
}
function highlight(text) {
  let s = esc(text);
  for (const t of search.terms) {
    const i = s.toLowerCase().indexOf(esc(t));
    if (i >= 0) s = s.slice(0, i) + "<mark>" + s.slice(i, i + esc(t).length) + "</mark>" + s.slice(i + esc(t).length);
  }
  return s;
}

// ---- actions: one list feeds the command palette and the right-click menu -----
const sel = () => DATA.nodes[selected];
const label = () => sel().label;
const ACTIONS = [
  { group: "Selection", icon: "↓", title: () => `Blast radius of ${label()}`, hint: "B", when: () => selected, run: () => setMode("down"), ctx: 1 },
  { group: "Selection", icon: "↑", title: () => `Dependencies of ${label()}`, hint: "D", when: () => selected, run: () => setMode("up"), ctx: 1 },
  { group: "Selection", icon: "◎", title: () => "Isolate full lineage", hint: "I", when: () => selected, run: () => setMode("both"), ctx: 1 },
  { group: "Selection", icon: "⇢", title: () => `Path from ${label()} to…`, hint: "⇧ click", when: () => selected, run: () => openPalette(selected), ctx: 1 },
  { group: "Selection", icon: "⧉", title: () => "Copy TeamCity id", when: () => selected && /^(build|external)$/.test(sel().kind) && sel().sub, run: () => copy(sel().sub, "Copied id"), ctx: 1 },
  { group: "Selection", icon: "↗", title: () => "Open source at the analysed commit", when: () => selected && sourceURL(sel()), run: () => window.open(sourceURL(sel()), "_blank", "noopener"), ctx: 1 },
  { group: "Selection", icon: "⎘", title: () => "Copy link to this node", hint: "L", when: () => selected, run: copyLink, ctx: 1 },
  { group: "Selection", icon: "✕", title: () => "Clear selection", hint: "Esc", when: () => selected, run: clearSelection },
  { group: "Selection", icon: "◉", title: () => `Focus on ${label()}`, when: () => selected && view.kind !== "focus", run: () => openFocus(selected), ctx: 1 },
  { group: "Go to", icon: "▸", title: () => "Go to the table", hint: "H", when: () => !tableOn, run: () => show("table", null, { push: true }) },
  ...DATA.views.filter(v => v.kind !== "focus").map(v => ({ group: "Go to", icon: "▸", title: () => `Go to ${v.title}`, hint: mapViews.indexOf(v) >= 0 && mapViews.indexOf(v) < 9 ? String(mapViews.indexOf(v) + 1) : "", when: () => v !== view || tableOn, run: () => show(v.id, null, { push: true }) })),
  { group: "View", icon: "⤢", title: () => "Fit to screen", hint: "F", when: () => true, run: () => fit(true, true) },
  { group: "View", icon: "1", title: () => "Zoom to 100%", hint: "0", when: () => true, run: () => zoomCenter(1 / tf.k) },
  { group: "View", icon: "◧", title: () => "Toggle sidebar", hint: "[", when: () => true, run: () => $("side-toggle").click() },
  { group: "View", icon: "≋", title: () => "Toggle flowing edges", when: () => true, run: () => flowBox.click() },
  { group: "View", icon: "☾", title: () => "Toggle light / dark theme", hint: "T", when: () => true, run: () => $("theme").click() },
  { group: "View", icon: "▭", title: () => "Presentation mode", hint: "P", when: () => true, run: () => setPresent(!document.body.classList.contains("present")) },
  { group: "Share", icon: "⎘", title: () => "Copy link to this view", hint: "L", when: () => !selected, run: copyLink },
  { group: "Share", icon: "⇩", title: () => "Download this view as SVG", when: () => true, run: exportSVG },
  { group: "Share", icon: "⚠", title: () => `Show ${DATA.warnings.length} analysis warning${DATA.warnings.length > 1 ? "s" : ""}`, when: () => DATA.warnings && DATA.warnings.length, run: showWarnings },
  { group: "Share", icon: "?", title: () => "Keyboard shortcuts", hint: "?", when: () => true, run: () => setHelp(true) },
];

// ---- command palette -----------------------------------------------------------
function paletteItems() {
  const acts = ACTIONS.filter(a => a.when()).map(a => ({ act: a, group: a.group }));
  const words = (pal.cmd ? pal.cq : search.q).split(/\s+/).filter(Boolean);
  const match = i => words.every(w => i.act.title().toLowerCase().includes(w));
  if (pal.pick) {
    // only jobs connected to the selection can have a path
    const ok = new Set([...lineageAll.up, ...lineageAll.down]);
    ok.delete(pal.pick);
    const ids = (search.q ? search.all.map(r => r.id) : [...ok].sort((a, b) => DATA.nodes[a].label.localeCompare(DATA.nodes[b].label))).filter(id => ok.has(id));
    return ids.map(id => ({ id, group: `Reachable from ${DATA.nodes[pal.pick].label}` }));
  }
  if (pal.cmd || !search.q) return acts.filter(match);
  return [...search.all.slice(0, 10).map(r => ({ id: r.id, group: "Jobs, targets & images" })), ...acts.filter(match).slice(0, 4)];
}
function renderResults() {
  if ($("palette").hidden) return;
  const box = $("results"), input = $("search"), items = pal.items = paletteItems();
  search.active = Math.min(search.active, Math.max(0, items.length - 1));
  let h = "", group = null;
  if (!items.length) h = `<div class="empty">${pal.pick ? "No connected job matches" : pal.cmd ? "No command matches" : `No builds, targets or images match “${esc(search.q)}”`}.</div>`;
  items.forEach((it, i) => {
    if (it.group !== group) { group = it.group; h += `<h5>${esc(group)}</h5>`; }
    const on = i === search.active ? " on" : "";
    if (it.act) {
      h += `<div class="r act${on}" role="option" id="res-${i}" aria-selected="${!!on}" data-i="${i}"><span class="ico">${it.act.icon}</span>
        <div class="main"><div class="title">${highlight(it.act.title())}</div></div>${it.act.hint ? `<kbd>${esc(it.act.hint)}</kbd>` : ""}</div>`;
      return;
    }
    const n = DATA.nodes[it.id], vs = viewsOf(it.id);
    const where = [n.repo, view.ids.has(it.id) ? "in this view" : "→ " + vs[0].title].filter(Boolean).join(" · ");
    h += `<div class="r${on}" role="option" id="res-${i}" aria-selected="${!!on}" data-i="${i}">
      <span class="sw ${nodeClass(n)}" style="width:12px;height:12px;border-radius:3px;border:1.6px solid var(--stroke);background:var(--fill)"></span>
      <div class="main"><div class="title">${highlight(n.label)}</div><div class="where">${esc(where)}${n.sub ? " · " + highlight(n.sub) : ""}</div></div>
      <span class="pill">${esc(kindName(n))}</span></div>`;
  });
  if (search.q && !pal.pick && search.all.length > 10) h += `<div class="more">${search.all.length - 10} more — refine the search</div>`;
  h += `<div class="foot"><span><kbd>↑</kbd><kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> ${pal.pick ? "show path" : "open"}</span><span><kbd>Esc</kbd> close</span>${pal.pick ? "" : "<span><kbd>&gt;</kbd> commands</span>"}</div>`;
  box.innerHTML = h;
  input.setAttribute("aria-activedescendant", items.length ? "res-" + search.active : "");
  box.querySelector(".r.on")?.scrollIntoView({ block: "nearest" });
}
function openPalette(pick = null) {
  closeCtx();
  pal.pick = pick;
  if (pick) { $("search").value = ""; runSearch(false); }
  $("search").placeholder = pick ? `Path from “${DATA.nodes[pick].label}” to…` : "Search jobs, images, targets — or type > for commands";
  $("palette").hidden = false;
  search.active = 0;
  $("search").focus(); $("search").select();
  renderResults();
}
function closePalette() { $("palette").hidden = true; pal.pick = null; $("search").blur(); }
function openItem(i) {
  const it = pal.items[i], pick = pal.pick;
  if (!it) return;
  closePalette();
  if (it.act) it.act.run();
  else if (pick) setPath(it.id);
  else goTo(it.id);
}
// cycle through the hits in the current view
function nextHit(dir) {
  if (!search.inView.length) return;
  search.cur = (search.cur + dir + search.inView.length) % search.inView.length;
  const id = search.inView[search.cur];
  searchLabel();
  if (selected) show(view.id, null, { push: false });
  paint();
  focusNode(id, Math.max(tf.k, 0.9));
}
$("palette-btn").onclick = () => openPalette();
$("palette").addEventListener("click", ev => { if (ev.target === $("palette")) closePalette(); });
$("search").addEventListener("input", () => runSearch());
$("results").addEventListener("pointerdown", ev => { const r = ev.target.closest(".r"); if (r) { ev.preventDefault(); openItem(+r.dataset.i); } });
$("search").addEventListener("keydown", ev => {
  const n = pal.items.length;
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
    ev.preventDefault();
    if (n) { search.active = (search.active + (ev.key === "ArrowDown" ? 1 : -1) + n) % n; renderResults(); }
  } else if (ev.key === "Enter") {
    ev.preventDefault();
    openItem(search.active);
  } else if (ev.key === "Escape") {
    ev.stopPropagation();
    if (ev.target.value) { ev.target.value = ""; runSearch(); } else closePalette();
  }
});

// ---- right-click menu on a job ---------------------------------------------------
const ctx = $("ctx");
let ctxItems = [];
function openCtx(id, x, y) {
  if (selected !== id) show(view.id, id, { push: true, reveal: true });
  ctxItems = ACTIONS.filter(a => a.ctx && a.when());
  ctx.innerHTML = ctxItems.map((a, i) => `<button role="menuitem" data-i="${i}"><span class="ico">${a.icon}</span><span>${esc(a.title())}</span>${a.hint ? `<kbd>${esc(a.hint)}</kbd>` : ""}</button>`).join("");
  ctx.hidden = false;
  const r = ctx.getBoundingClientRect();
  ctx.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + "px";
  ctx.style.top = Math.max(8, Math.min(y, innerHeight - r.height - 8)) + "px";
  ctx.querySelector("button")?.focus();
}
function closeCtx() { ctx.hidden = true; }
ctx.addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { const a = ctxItems[+b.dataset.i]; closeCtx(); a.run(); } });
ctx.addEventListener("keydown", ev => {
  if (ev.key !== "ArrowDown" && ev.key !== "ArrowUp") return;
  ev.preventDefault();
  const bs = [...ctx.querySelectorAll("button")], i = bs.indexOf(document.activeElement);
  bs[(i + (ev.key === "ArrowDown" ? 1 : -1) + bs.length) % bs.length].focus();
});
document.addEventListener("pointerdown", ev => { if (!ctx.hidden && !ctx.contains(ev.target)) closeCtx(); }, true);

// ---- first-run hint ----------------------------------------------------------------
function dismissHint() { if ($("hint").hidden) return; $("hint").hidden = true; store.set("pg-hint", "1"); }
$("hint-x").onclick = dismissHint;
$("hint").hidden = !!store.get("pg-hint");

// ---- keyboard ----------------------------------------------------------------
const KEYS = [
  ["Navigate"],
  ["Search and commands", "/ · Ctrl/⌘+K"], ["Next / previous hit on the map", "N  ⇧N"],
  ["Table of all jobs", "H"], ["Focus on selected job", "Enter in table · ◉ Focus"], ["Switch view", "1 – 9"], ["Back / forward", "Alt ← / →"],
  ["Clear selection, close", "Esc"], ["Toggle sidebar", "["],
  ["Canvas"],
  ["Pan", "scroll · drag · arrows"], ["Zoom", "pinch · Ctrl+scroll · + −"],
  ["Fit to screen", "F"], ["Zoom 100%", "0"],
  ["Zoom into node / canvas", "double-click"], ["Select node", "click · Tab + Enter"],
  ["Selection"],
  ["Blast radius (downstream only)", "B"], ["Dependencies (upstream only)", "D"],
  ["Isolate full lineage", "I"], ["Path to another job", "Shift+click"],
  ["Job actions menu", "right-click · Shift+F10"], ["Centre on selection", "Enter"],
  ["Copy link to this view / node", "L"], ["Hover an edge", "shows its endpoints"],
  ["Sharing"],
  ["Presentation mode", "P"], ["Light / dark theme", "T"],
  ["Export view as SVG", "button in toolbar"], ["This help", "?"],
];
$("help-rows").innerHTML = KEYS.map(([a, b]) => b ? `<div class="row"><span>${esc(a)}</span><span>${esc(b).split(" · ").map(x => /^[^a-z]{1,9}$|^Esc$|^Alt|^Ctrl|^Tab|^Shift/.test(x) ? `<kbd>${x}</kbd>` : x).join(" · ")}</span></div>` : `<h3>${esc(a)}</h3>`).join("");
function setHelp(open) { $("help").hidden = !open; if (open) $("help").querySelector(".help").focus?.(); }
$("help-btn").onclick = () => setHelp(true);
$("side-help").onclick = () => setHelp(true);
$("help").addEventListener("click", ev => { if (ev.target === $("help")) setHelp(false); });

window.addEventListener("keydown", ev => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); return $("palette").hidden ? openPalette() : closePalette(); }
  if (ev.key === "Escape") {
    if (!ctx.hidden) return closeCtx();
    if (!$("palette").hidden) return closePalette();
    if (!$("help").hidden) return setHelp(false);
    if (!$("meta-pop").hidden) { $("meta-pop").hidden = true; return; }
    if (typing) return;
    if (selected && view.kind === "focus" && selected === view.root) return show("table", null, { push: true });
    if (selected) return clearSelection();
    if (search.q) { $("search").value = ""; return runSearch(false); }
    if (panelOpen()) return closePanel();
    if (document.body.classList.contains("present")) return setPresent(false);
    return;
  }
  if (typing || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (!$("help").hidden) return;
  const pan = ev.shiftKey ? 240 : 80;
  const k = ev.key;
  if (k === "/") { ev.preventDefault(); tableOn ? $("t-q").focus() : openPalette(); }
  else if (k === "h" || k === "H") show("table", null, { push: true });
  else if (k === "?") setHelp(true);
  else if (k === "f" || k === "F") fit(true, true);
  else if (k === "0") zoomCenter(1 / tf.k);
  else if (k === "+" || k === "=") zoomCenter(1.25);
  else if (k === "-" || k === "_") zoomCenter(0.8);
  else if (k === "ArrowLeft") { ev.preventDefault(); animateTo({ ...tf, x: tf.x + pan }, false); }
  else if (k === "ArrowRight") { ev.preventDefault(); animateTo({ ...tf, x: tf.x - pan }, false); }
  else if (k === "ArrowUp") { ev.preventDefault(); animateTo({ ...tf, y: tf.y + pan }, false); }
  else if (k === "ArrowDown") { ev.preventDefault(); animateTo({ ...tf, y: tf.y - pan }, false); }
  else if (k === "[") $("side-toggle").click();
  else if (k === "t" || k === "T") $("theme").click();
  else if (k === "p" || k === "P") setPresent(!document.body.classList.contains("present"));
  else if (k === "i" || k === "I") toggleIsolate();
  else if (k === "b" || k === "B") setMode("down");
  else if (k === "d" || k === "D") setMode("up");
  else if (k === "l" || k === "L") copyLink();
  else if (k === "n") nextHit(1);
  else if (k === "N") nextHit(-1);
  else if (k === "Enter" && selected && !ev.target.closest?.(".node, button, a")) focusNode(selected, Math.max(tf.k, 1));
  else if (/^[1-9]$/.test(k) && mapViews[+k - 1]) show(mapViews[+k - 1].id, null, { push: true });
});

// ---- start -------------------------------------------------------------------
setSidebar(store.get("pg-sidebar") !== "closed" && !narrow.matches);
window.addEventListener("resize", () => view && (selected ? reveal(selected) : fit(false)));
(function () {
  let { vid, nid, to } = readHash();
  if (vid !== "table" && !viewById[vid]) { vid = store.get("pg-view") || "table"; nid = null; to = null; }
  show(vid === "table" || viewById[vid] ? vid : "table", nid, { focus: !!nid && !/^focus:/.test(vid), instant: true, to });
})();
</script>
</body>
