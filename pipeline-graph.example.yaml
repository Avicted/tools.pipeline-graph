# `make run` copies this file to pipeline-graph.yaml (gitignored) the first time.
# As shipped it analyses the bundled Acme demo repos, so it works offline.

# ▼▼▼ YOUR REPOS GO HERE ▼▼▼
# Replace the demo entries below with your own git URLs, then run `make run`.
repos:
  # - git@github.com:your-org/your-repo.git       # a bare URL is enough
  # - url: git@github.com:your-org/base.git       # or a mapping with options:
  #   branch: main                                #   default: the remote's default branch
  #   name: base                                  #   swimlane title; default: repo name from the URL
  #   provider: teamcity                          #   teamcity | github; default: every one found in the repo
  #   teamcity_project_id: Base                   #   default: derived from name
  #   teamcity_dir: .teamcity                     #   default: the global teamcity_dir below
  # - ./relative/path/to/checkout                 # local checkouts need no clone (must be inside this directory)

  # --- demo repos: delete these when you add your own ---
  - examples/acme/repos/platform-images
  - examples/acme/repos/shared-libs
  - examples/acme/repos/infra-terraform
  - examples/acme/repos/orders-service
  - examples/acme/repos/payments-service
  - examples/acme/repos/web-frontend
  - examples/acme/repos/release-train
# ▲▲▲ YOUR REPOS GO HERE ▲▲▲

# cache_dir: ~/.cache/pipeline-graph   # shallow clones are kept and refreshed here
out_dir: out
teamcity_dir: .teamcity
views: [overview, full, per-repo]       # draw.io pages / HTML tabs
formats: [drawio, vsdx, html, mermaid, dot, json]
concurrency: 4

# Absolute TeamCity ids referenced from the DSL that the tool cannot map by
# itself (see warnings.txt), mapped to "<repo name>/<relative id>".
external_ids:
  # Acme_Legacy_PlatformBase_BuildBaseImage: platform-base/BuildBaseImage
