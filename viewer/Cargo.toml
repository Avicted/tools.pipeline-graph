[package]
name = "pipeline-graph-viewer"
version = "0.2.0"
edition = "2021"
description = "Native viewer for pipeline-graph's graph.json: a snapshot of what is actually built"
license = "GPL-3.0-only"
rust-version = "1.85"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = { version = "0.31", default-features = false }
egui_extras = { version = "0.31", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nucleo-matcher = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The gate runs clippy with -D warnings; these are the few things worth refusing outright.
[lints.rust]
unsafe_code = "forbid" # there is none; graph.json is untrusted input and the viewer aborts on a panic

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
